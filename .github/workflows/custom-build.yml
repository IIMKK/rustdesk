# ============================================================
#  RustDK — RustDesk 定制编译流水线
#  由「RustDesk 定制编译工作台」生成
#
#  使用方法:
#    1. Fork https://github.com/rustdesk/rustdesk 到你的账号
#    2. 将本文件放入 fork 仓库的 .github/workflows/ 目录
#    3. 将 customize.py 放到 fork 仓库根目录
#    4. 推送后进入 Actions 页签手动运行本工作流
#
#  注意: 各平台构建步骤依据 rustdesk 官方 flutter-build.yml 精简,
#        若上游升级导致失败, 请对照官方 workflow 调整依赖版本。
# ============================================================
name: "Build RustDK (RustDesk Custom)"

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: ["customize.py", ".github/workflows/**"]

env:
  UPSTREAM_REF: "master"
  # ===== 定制参数 (由工作台生成; 公钥建议改放到仓库 Secrets) =====
  APP_NAME: "RustDK"
  RENDEZVOUS_SERVER: "rd.iimkk.cn"
  RS_PUB_KEY: "789qwe456"
  API_SERVER: "https://rdapi.iimkk.cn"
  DEFAULT_PASSWORD: "00PzfB75TNJoQeP2WQsVLzmb1rnCq49O3OYg=="
  PROCESS_NAME: "RustDK"

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout rustdesk (含子模块)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 应用定制补丁
        run: python customize.py
      - name: 显示补丁后的关键配置
        shell: bash
        run: |
          grep -nE "RENDEZVOUS_SERVERS|RS_PUB_KEY|APP_NAME" libs/hbb_common/src/config.rs | head -20 || true
      - name: 安装 LLVM (bindgen 依赖)
        shell: pwsh
        run: |
          # 镜像已预装 LLVM(如 20.1.8)时跳过安装, 避免版本冲突
          $clang = "C:\Program Files\LLVM\bin\clang.exe"
          if (-not (Test-Path $clang)) {
            choco install -y llvm
          }
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: 准备 vcpkg 依赖
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 幂等克隆: 镜像可能已预装 C:\vcpkg; 拉取失败不致命, 用现有版本即可
          if (Test-Path C:\vcpkg\.git) {
            git -C C:\vcpkg pull --ff-only
            if ($LASTEXITCODE -ne 0) { Write-Host "vcpkg git pull 失败, 使用现有版本继续" }
          } elseif (-not (Test-Path C:\vcpkg)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg
            if ($LASTEXITCODE -ne 0) { throw "克隆 vcpkg 失败" }
          }
          if (-not (Test-Path C:\vcpkg\vcpkg.exe)) {
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "bootstrap vcpkg 失败" }
          }
          echo "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          # rustdesk 仓库根目录有 vcpkg.json, 须强制 classic 模式才能按包名安装
          # pwsh 默认不感知外部命令退出码, 必须逐包检查 $LASTEXITCODE
          foreach ($p in 'libvpx','libyuv','opus','aom') {
            C:\vcpkg\vcpkg.exe install --classic "${p}:x64-windows-static"
            if ($LASTEXITCODE -ne 0) { throw "vcpkg install ${p}:x64-windows-static 失败" }
          }
          # 验证 magnum-opus 编译期必需的头文件确实存在
          if (-not (Test-Path C:\vcpkg\installed\x64-windows-static\include\opus\opus_multistream.h)) {
            throw "opus 头文件缺失, vcpkg 安装不完整"
          }
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: 生成 Rust-Dart 桥接代码 (flutter_rust_bridge)
        shell: bash
        run: |
          # 版本须与 Cargo.lock 中的 flutter_rust_bridge 一致 (当前 1.80.1)
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --dart-output flutter/lib/generated_bridge.dart
      - name: 编译 (Flutter UI)
        run: |
          flutter config --enable-windows-desktop
          python build.py --flutter
      - name: 打包产物
        shell: bash
        run: |
          cd flutter/build/windows/x64/runner/Release
          BIN_NAME="${PROCESS_NAME:-$APP_NAME}"
          mv rustdesk.exe "${BIN_NAME}.exe" || true
          zip -r "${APP_NAME}-windows-x64.zip" .
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-x64
          path: flutter/build/windows/x64/runner/Release/${{ env.APP_NAME }}-windows-x64.zip

